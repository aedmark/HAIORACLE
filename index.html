<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#110d20">
  <meta name="description" content="Enter a phrase. Receive a deterministic audiovisual omen composed in LOLCODE.">
  <title>HAI, ORACLE!</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#oracle-controls">Skip to the oracle</a>

  <main>
    <canvas id="vision" aria-label="The oracle's animated audiovisual creature"></canvas>
    <div class="grain" aria-hidden="true"></div>

    <header class="masthead">
      <a class="wordmark" href="#" aria-label="HAI, ORACLE! home">
        <span class="prompt-mark">&gt;</span> HAI, ORACLE!
      </a>
      <button class="icon-button" id="sound-toggle" type="button" aria-pressed="false" aria-label="Mute sound">
        <span class="sound-on" aria-hidden="true">SOUND: ON</span>
        <span class="sound-off" aria-hidden="true">SOUND: OFF</span>
      </button>
    </header>

    <section class="oracle-shell" aria-labelledby="invitation">
      <p class="eyebrow">A TINY MACHINE FOR SYNTHETIC OMENS</p>
      <h1 id="invitation">FEED IT A THOUGHT.<br><em>SEE WHAT HUMS BACK.</em></h1>

      <form id="oracle-controls" class="summon-form">
        <label for="phrase">YOUR PERFECTLY ORDINARY PHRASE</label>
        <div class="input-row">
          <input id="phrase" name="phrase" type="text" maxlength="72" autocomplete="off"
                 placeholder="the moon owes me five dollars" required>
          <button class="summon-button" type="submit">
            <span>SUMMON</span>
            <span aria-hidden="true">↗</span>
          </button>
        </div>
        <div class="form-foot">
          <button class="text-button" id="surprise" type="button">SURPRISE ME</button>
          <span>SAME WORDS. SAME CREATURE. EVERY TIME.</span>
        </div>
      </form>
    </section>

    <section class="reading" id="reading" aria-live="polite" aria-atomic="true">
      <div>
        <p class="reading-label">NOW CHANNELING</p>
        <h2 id="creature-name">THE ORACLE IS LISTENING</h2>
      </div>
      <div class="score-card" aria-label="Generated score">
        <span><b id="score-pulse">---</b> BPM</span>
        <span><b id="score-wave">---</b> WAVE</span>
        <span><b id="score-form">---</b> FORM</span>
      </div>
      <button class="replay-button" id="replay" type="button" disabled>
        RESTART LOOP <span aria-hidden="true">↻</span>
      </button>
    </section>

    <footer>
      <span>COMPOSED IN LOLCODE 1.2</span>
      <span id="status" role="status">AWAITING INPUT</span>
      <a href="src/oracle.lol">VIEW THE SPELL</a>
    </footer>
  </main>

  <noscript>HAI ORACLE needs JavaScript to interpret its LOLCODE spell and render the omen.</noscript>
  <script type="module" src="src/app.mjs"></script>
</body>
</html>
