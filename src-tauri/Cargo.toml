[package]
name = "esoteric-fun-machine"
version = "1.0.0"
description = "Edmark's Esoteric Fun Machine - Standalone Studio Companion"
authors = ["Gordon K"]
license = "MIT"
edition = "2021"

[lib]
name = "esoteric_fun_machine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-midi = "0.3.1"
