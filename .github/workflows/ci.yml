name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Automated Test & Documentation Suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Node test suite
        run: node --test tests/*.test.mjs

      - name: Check documentation consistency
        run: python3 tools/check_docs.py

      - name: Validate 3x technical manual
        run: python3 tools/manual.py check docs/manual.json
